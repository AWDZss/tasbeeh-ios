<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#123b35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="تسبيح" />
    <title>تطبيق تسبيح</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-label="تطبيق تسبيح">
      <section class="topbar">
        <div>
          <p class="eyebrow">ذكر اليوم</p>
          <h1>تسبيح</h1>
        </div>
        <div class="top-actions">
          <button class="top-action-button" id="openLearningPage" type="button">جميع الأذكار</button>
          <button class="top-action-button" id="openProgressPage" type="button">التقدم</button>
        </div>
      </section>

      <div class="voice-controls" data-voice-controls>
        <label class="voice-switch">
          <input type="checkbox" role="switch" data-voice-toggle aria-label="العد بالصوت" />
          <span class="voice-switch-track" aria-hidden="true"></span>
          <span>العد بالصوت</span>
        </label>
        <span class="voice-status" data-voice-status role="status">الاستماع متوقف</span>
      </div>

      <section class="dhikr-panel" id="dhikrPanel" aria-live="polite" role="button" tabindex="0" aria-label="فتح قائمة الأذكار">
        <button class="chip-nav" id="prevDhikr" type="button" aria-label="الذكر السابق">‹</button>
        <div class="dhikr-copy">
          <p class="dhikr-title" id="dhikrTitle">سبحان الله</p>
          <p class="dhikr-subtitle" id="dhikrSubtitle">املأ وقتك بذكر خفيف على اللسان</p>
        </div>
        <button class="chip-nav" id="nextDhikr" type="button" aria-label="الذكر التالي">›</button>
        <div class="dhikr-tools">
          <button class="dhikr-tool-button add-tool-button" id="addDhikrToggle" type="button">إضافة</button>
          <button class="dhikr-tool-button delete-tool-button" id="deleteDhikrButton" type="button">حذف</button>
        </div>
      </section>

      <section class="counter-card">
        <form class="lap-target-form is-collapsed" id="lapTargetForm">
          <label for="lapTargetInput">عدد التسبيحات في اللفة</label>
          <div class="lap-target-row">
            <input id="lapTargetInput" type="number" min="1" max="99999" inputmode="numeric" autocomplete="off" />
            <button type="submit">حفظ</button>
          </div>
        </form>
        <button class="lap-target-compact" id="lapTargetCompact" type="button">
          عدد التسبيحات: <span id="lapTargetCompactValue">33</span>
        </button>

        <div class="progress-ring" aria-hidden="true">
          <svg viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="98"></circle>
            <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="98"></circle>
          </svg>
          <div class="counter-readout">
            <span class="count" id="count">0</span>
            <span class="target" id="targetLabel">من 33</span>
          </div>
        </div>

        <button class="tap-button" id="tapButton" type="button">
          اضغط للتسبيح
        </button>
      </section>

      <section class="stats">
        <div>
          <span class="stat-label">لفات هذا الذكر</span>
          <strong id="sessionsToday">0</strong>
        </div>
        <div>
          <span class="stat-label">إجمالي التسبيح</span>
          <strong id="totalCount">0</strong>
        </div>
      </section>
    </main>

    <div class="modal-overlay is-hidden" id="customDhikrModal" aria-hidden="true">
      <form class="custom-dhikr-form modal-card" id="customDhikrForm">
        <div class="modal-header">
          <h2>إضافة ذكر جديد</h2>
          <button class="modal-close" id="closeDhikrModal" type="button" aria-label="إغلاق">×</button>
        </div>
        <label class="custom-dhikr-label" for="customDhikrInput">اكتب ذكر جديد</label>
        <input id="customDhikrInput" type="text" maxlength="80" autocomplete="off" placeholder="مثال: سبحان الله وبحمده" />
        <label class="custom-dhikr-label" for="customDhikrBenefitInput">فائدة الذكر</label>
        <input id="customDhikrBenefitInput" type="text" maxlength="120" autocomplete="off" placeholder="اكتب فائدة الذكر" />
        <button class="add-dhikr-button" type="submit">حفظ الذكر</button>
      </form>
    </div>

    <div class="dhikr-list-page is-hidden" id="dhikrListPage" aria-hidden="true">
      <section class="dhikr-list-card">
        <div class="modal-header">
          <h2>كل الأذكار</h2>
          <button class="modal-close" id="closeDhikrList" type="button" aria-label="إغلاق">×</button>
        </div>
        <div class="dhikr-list-body" id="dhikrListBody"></div>
      </section>
    </div>

    <div class="progress-page is-hidden" id="progressPage" aria-hidden="true">
      <section class="progress-card">
        <div class="modal-header">
          <h2>تقدم التسبيح</h2>
          <button class="modal-close" id="closeProgressPage" type="button" aria-label="إغلاق">×</button>
        </div>
        <div class="weekly-summary">
          <div>
            <span class="stat-label">تسبيح هذا الأسبوع</span>
            <strong id="weeklyTotal">0</strong>
          </div>
          <div>
            <span class="stat-label">معدل اليوم</span>
            <strong id="weeklyAverage">0</strong>
          </div>
        </div>
        <div class="circle-chart" id="weeklyCircleChart"></div>
        <div class="daily-list" id="dailyProgressList"></div>
      </section>
    </div>

    <div class="learning-page is-hidden" id="learningPage" aria-hidden="true">
      <section class="learning-card">
        <div class="modal-header">
          <div>
            <h2>جميع الأذكار</h2>
            <span class="learning-step" id="learningStepLabel">الصباح والمساء: 1 من 8</span>
          </div>
          <button class="modal-close" id="closeLearningPage" type="button" aria-label="إغلاق">×</button>
        </div>
        <div class="voice-controls" data-voice-controls>
          <label class="voice-switch">
            <input type="checkbox" role="switch" data-voice-toggle aria-label="العد بالصوت" />
            <span class="voice-switch-track" aria-hidden="true"></span>
            <span>العد بالصوت</span>
          </label>
          <span class="voice-status" data-voice-status role="status">الاستماع متوقف</span>
        </div>
        <div class="learning-tabs" id="learningTabs">
          <button class="learning-tab is-active" type="button" data-category="morningEvening">الصباح والمساء</button>
          <button class="learning-tab" type="button" data-category="once">مرة واحدة</button>
          <button class="learning-tab" type="button" data-category="protection">التحصين</button>
          <button class="learning-tab" type="button" data-category="custom">تخصيص</button>
        </div>
        <article class="learning-dhikr-card">
          <p class="label">الذكر الحالي</p>
          <h3 id="learningDhikrText">بسم الله</h3>
          <p class="learning-benefit" id="learningBenefitText"></p>
          <p class="learning-source" id="learningSourceText"></p>
          <div class="learning-stats">
            <div>
              <span>لفة</span>
              <strong id="learningCountText">0</strong>
            </div>
            <div class="learning-target-stat" id="learningTargetStat" role="button" tabindex="0" aria-label="تعديل عدد الذكر">
              <span>عداد</span>
              <strong id="learningTargetText">1</strong>
            </div>
          </div>
          <div class="learning-progress" aria-hidden="true">
            <span id="learningProgressFill"></span>
          </div>
          <p class="learning-message" id="learningMessageText"></p>
        </article>
        <form class="learning-custom-form is-hidden" id="learningCustomForm">
          <div class="learning-current-target is-hidden" id="learningCurrentTargetRow">
            <input id="learningCurrentTarget" type="number" min="1" max="99999" inputmode="numeric" autocomplete="off" placeholder="عدد الذكر الحالي" />
            <button id="learningSaveTargetButton" type="button">حفظ العدد</button>
          </div>
          <div class="learning-custom-fields is-hidden" id="learningCustomFields">
            <input id="learningCustomText" type="text" maxlength="120" autocomplete="off" placeholder="اكتب الذكر" />
            <input id="learningCustomBenefit" type="text" maxlength="180" autocomplete="off" placeholder="اكتب الفائدة" />
            <input id="learningCustomTarget" type="number" min="1" max="99999" inputmode="numeric" autocomplete="off" placeholder="العدد" />
          </div>
          <div>
            <button class="learning-add-button" id="learningAddButton" type="button">إضافة</button>
            <button class="learning-delete-button" id="learningDeleteButton" type="button">حذف الحالي</button>
          </div>
        </form>
        <div class="learning-actions">
          <button class="learning-say-button" id="learningSayButton" type="button">قلت الذكر</button>
          <div>
            <button id="learningPrevButton" type="button">السابق</button>
            <button id="learningResetButton" type="button">إعادة</button>
          </div>
        </div>
      </section>
    </div>

    <div class="app-toast is-hidden" id="appToast" role="status" aria-live="polite"></div>

    <script src="speech-counter.js"></script>
    <script src="app.js"></script>
  </body>
</html>
